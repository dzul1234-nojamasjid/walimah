<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wedding E-Card Maker — Dzul Arts</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      background: #0f172a;
      color: #f8fafc;
      font-family: system-ui, -apple-system, sans-serif;
      padding: 18px 14px 48px;
    }
    .wrap { max-width: 880px; margin: 0 auto; }
    h1 { font-size: 20px; color: #facc15; margin-bottom: 4px; }
    .sub { font-size: 12.5px; color: #94a3b8; margin-bottom: 16px; line-height: 1.5; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    @media (max-width: 680px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: #1e293b; border: 1px solid #334155;
      border-radius: 14px; padding: 14px; margin-bottom: 14px;
    }
    .grp { margin-bottom: 11px; }
    .grp:last-child { margin-bottom: 0; }
    label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; padding: 9px 10px; border-radius: 9px;
      border: 1px solid #475569; background: #0f172a; color: #ffffff;
      font-size: 13px; font-family: inherit;
    }
    input.auto-field {
      background: #162032;
      color: #94a3b8;
      border-color: #334155;
      cursor: not-allowed;
    }
    .ymd-row {
      display: grid;
      grid-template-columns: 1fr 1.35fr 1fr;
      gap: 8px;
    }
    .hm-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.2fr;
      gap: 8px;
    }
    textarea.code-out {
      min-height: 230px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 11.5px; line-height: 1.45; color: #fde68a;
      white-space: pre; overflow-x: auto;
    }
    .btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
    button {
      padding: 10px 14px; border-radius: 10px; border: none;
      font-size: 13px; font-weight: 700; cursor: pointer;
    }
    .btn-gen { background: #facc15; color: #0f172a; }
    .btn-copy { background: #38bdf8; color: #0f172a; }
    .btn-dl { background: #22c55e; color: #052e16; }
    .status-msg { margin-top: 8px; font-size: 12px; color: #4ade80; min-height: 18px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Wedding Invitation E-Card Maker</h1>
    <p class="sub">
      Dilengkapi <strong>3D Echo Kompang &amp; Melodi Pengantin</strong> berulang (loop) dengan output audio kuat. Kotak kelabu dikemas kini automatik.
    </p>

    <div class="card">
      <div class="grid">
        <div class="grp">
          <label>1. Nama Pengantin Lelaki (Groom)</label>
          <input type="text" id="wGroom" value="Teruna" />
        </div>
        <div class="grp">
          <label>2. Nama Pengantin Perempuan (Bride)</label>
          <input type="text" id="wBride" value="Dara" />
        </div>
        <div class="grp">
          <label>3. Keluarga Pengantin Lelaki (Baris 1)</label>
          <input type="text" id="wGroomFam" value="Haji Bakhil &amp; Hajjah Bakhil" />
        </div>
        <div class="grp">
          <label>4. Keluarga Pengantin Perempuan (Baris 2)</label>
          <input type="text" id="wBrideFam" value="Tok Siak &amp; Mak Siak" />
        </div>

        <div class="grp">
          <label>5. Pilih Tarikh Penuh Kalendar (2026–2030)</label>
          <div class="ymd-row">
            <select id="selYear" onchange="populateDaysAndSync()"></select>
            <select id="selMonth" onchange="populateDaysAndSync()"></select>
            <select id="selDay" onchange="syncDateTime()"></select>
          </div>
        </div>

        <div class="grp">
          <label>6. Hari &amp; Tarikh (BM — Auto)</label>
          <input type="text" id="wDayDateMs" class="auto-field" readonly tabindex="-1" value="Sabtu, 16 Januari 2027" />
        </div>

        <div class="grp">
          <label>7. Day &amp; Date (EN — Auto)</label>
          <input type="text" id="wDayDateEn" class="auto-field" readonly tabindex="-1" value="Saturday, 16 January 2027" />
        </div>

        <div class="grp">
          <label>8. Masa Mula (HH:MM setiap 5 minit &amp; Sesi)</label>
          <div class="hm-row">
            <select id="selHour" onchange="syncDateTime()"></select>
            <select id="selMin" onchange="syncDateTime()"></select>
            <select id="selDur" onchange="syncDateTime()">
              <option value="2">2 Jam (+2h)</option>
              <option value="3">3 Jam (+3h)</option>
              <option value="4" selected>4 Jam (+4h)</option>
              <option value="6">6 Jam (+6h)</option>
            </select>
          </div>
        </div>

        <div class="grp">
          <label>9. Masa / Sesi (BM — Auto)</label>
          <input type="text" id="wTimeMs" class="auto-field" readonly tabindex="-1" value="Petang • 4:00 PTG – 8:00 MLM" />
        </div>

        <div class="grp">
          <label>10. Time / Session (EN — Auto)</label>
          <input type="text" id="wTimeEn" class="auto-field" readonly tabindex="-1" value="Evening • 4:00 PM – 8:00 PM" />
        </div>

        <div class="grp">
          <label>11. Lokasi / Tempat (BM)</label>
          <input type="text" id="wLocMs" value="Dewan Serbaguna Community Centre, 12 Jalan Harmoni (Bukan kolong blok)" />
        </div>
        <div class="grp">
          <label>12. Venue / Location (EN)</label>
          <input type="text" id="wLocEn" value="Community Centre Hall, 12 Jalan Harmoni (Not void deck)" />
        </div>
        <div class="grp">
          <label>13. Tarikh &amp; Masa Countdown (ISO +08:00 — Auto)</label>
          <input type="text" id="wIso" class="auto-field" readonly tabindex="-1" value="2027-01-16T16:00:00+08:00" />
        </div>
        <div class="grp">
          <label>14. Pautan Google Maps</label>
          <input type="text" id="wMap" value="https://maps.google.com/?q=Community+Centre+12+Jalan+Harmoni" />
        </div>
        <div class="grp">
          <label>15. Nama Fail Gambar Pengantin</label>
          <input type="text" id="wArt" value="wedding.jpg" />
        </div>
        <div class="grp">
          <label>16. Nama Fail HTML Keluaran (Default: temp.html)</label>
          <input type="text" id="wFile" value="temp.html" />
        </div>
        <div class="grp">
          <label>17. Tema Warna</label>
          <select id="wTheme">
            <option value="gold-dark" selected>1. Classic Gold &amp; Dark Espresso</option>
            <option value="emerald-gold">2. Emerald Green &amp; Gold</option>
            <option value="ivory-gold">3. Ivory Cream &amp; Gold</option>
            <option value="rose-gold">4. Dusty Rose &amp; Gold</option>
            <option value="royal-navy">5. Royal Navy &amp; Champagne</option>
          </select>
        </div>
        <div class="grp">
          <label>18. Sampul Pembuka (Envelope)?</label>
          <select id="wEnv">
            <option value="1" selected>Yes — Interactive Envelope</option>
            <option value="0">No — Direct Card View</option>
          </select>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-gen" onclick="generateWedding()">⚡ Generate HTML</button>
        <button class="btn-copy" onclick="copyCode()">📋 Copy HTML</button>
        <button class="btn-dl" onclick="downloadHtml()">⬇ Download .html</button>
      </div>
      <div class="status-msg" id="statusMsg"></div>
    </div>

    <div class="card">
      <label>Generated Standalone Wedding E-Card HTML</label>
      <textarea class="code-out" id="outCode" readonly></textarea>
    </div>
  </div>

  <script>
    const DAYS_MS = ["Ahad", "Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu"];
    const DAYS_EN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const MONTHS_MS = ["Januari", "Februari", "Mac", "April", "Mei", "Jun", "Julai", "Ogos", "September", "Oktober", "November", "Disember"];
    const MONTHS_EN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

    function initDropdowns() {
      const selYear = document.getElementById("selYear");
      const selMonth = document.getElementById("selMonth");
      const selHour = document.getElementById("selHour");
      const selMin = document.getElementById("selMin");

      for (let y = 2026; y <= 2030; y++) {
        const opt = document.createElement("option");
        opt.value = String(y);
        opt.textContent = String(y);
        if (y === 2027) opt.selected = true;
        selYear.appendChild(opt);
      }

      for (let m = 0; m < 12; m++) {
        const opt = document.createElement("option");
        opt.value = String(m);
        opt.textContent = `${String(m + 1).padStart(2, "0")} - ${MONTHS_MS[m]}`;
        if (m === 0) opt.selected = true;
        selMonth.appendChild(opt);
      }

      for (let h = 0; h < 24; h++) {
        const opt = document.createElement("option");
        opt.value = String(h);
        opt.textContent = `${String(h).padStart(2, "0")}:00`;
        if (h === 16) opt.selected = true;
        selHour.appendChild(opt);
      }

      for (let mm = 0; mm < 60; mm += 5) {
        const opt = document.createElement("option");
        opt.value = String(mm);
        opt.textContent = String(mm).padStart(2, "0");
        if (mm === 0) opt.selected = true;
        selMin.appendChild(opt);
      }

      populateDaysAndSync();
    }

    function daysInMonth(year, monthIndex) {
      return new Date(Date.UTC(year, monthIndex + 1, 0)).getUTCDate();
    }

    function populateDaysAndSync() {
      const y = parseInt(document.getElementById("selYear").value, 10);
      const m = parseInt(document.getElementById("selMonth").value, 10);
      const selDay = document.getElementById("selDay");
      const prevDay = parseInt(selDay.value || "16", 10);
      const maxD = daysInMonth(y, m);

      selDay.innerHTML = "";
      for (let d = 1; d <= maxD; d++) {
        const dt = new Date(Date.UTC(y, m, d));
        const dowShortMs = ["Ahd", "Isn", "Sel", "Rab", "Kha", "Jum", "Sab"][dt.getUTCDay()];
        const opt = document.createElement("option");
        opt.value = String(d);
        opt.textContent = `${String(d).padStart(2, "0")} (${dowShortMs})`;
        if (d === Math.min(prevDay, maxD)) opt.selected = true;
        selDay.appendChild(opt);
      }

      syncDateTime();
    }

    function format12hMs(hour24, min) {
      const mmStr = String(min).padStart(2, "0");
      let period = "PG";
      if (hour24 >= 12 && hour24 < 14) period = "TGH";
      else if (hour24 >= 14 && hour24 < 19) period = "PTG";
      else if (hour24 >= 19) period = "MLM";

      let h12 = hour24 % 12;
      if (h12 === 0) h12 = 12;
      return `${h12}:${mmStr} ${period}`;
    }

    function format12hEn(hour24, min) {
      const mmStr = String(min).padStart(2, "0");
      const ampm = hour24 >= 12 ? "PM" : "AM";
      let h12 = hour24 % 12;
      if (h12 === 0) h12 = 12;
      return `${h12}:${mmStr} ${ampm}`;
    }

    function sessionLabel(hour24) {
      if (hour24 >= 6 && hour24 < 12) return { ms: "Pagi", en: "Morning" };
      if (hour24 >= 12 && hour24 < 16) return { ms: "Tengah Hari", en: "Afternoon" };
      if (hour24 >= 16 && hour24 < 19) return { ms: "Petang", en: "Evening" };
      return { ms: "Malam", en: "Night" };
    }

    function syncDateTime() {
      const y = parseInt(document.getElementById("selYear").value, 10);
      const m = parseInt(document.getElementById("selMonth").value, 10);
      const d = parseInt(document.getElementById("selDay").value, 10);

      const dt = new Date(Date.UTC(y, m, d));
      const dayIdx = dt.getUTCDay();

      document.getElementById("wDayDateMs").value = `${DAYS_MS[dayIdx]}, ${d} ${MONTHS_MS[m]} ${y}`;
      document.getElementById("wDayDateEn").value = `${DAYS_EN[dayIdx]}, ${d} ${MONTHS_EN[m]} ${y}`;

      const startH = parseInt(document.getElementById("selHour").value, 10);
      const startM = parseInt(document.getElementById("selMin").value, 10);
      const durH = parseInt(document.getElementById("selDur").value, 10);

      const totalEndMins = startH * 60 + startM + durH * 60;
      const endH = Math.floor((totalEndMins % (24 * 60)) / 60);
      const endM = totalEndMins % 60;

      const ses = sessionLabel(startH);
      document.getElementById("wTimeMs").value = `${ses.ms} • ${format12hMs(startH, startM)} – ${format12hMs(endH, endM)}`;
      document.getElementById("wTimeEn").value = `${ses.en} • ${format12hEn(startH, startM)} – ${format12hEn(endH, endM)}`;

      const mmIso = String(m + 1).padStart(2, "0");
      const ddIso = String(d).padStart(2, "0");
      const hhIso = String(startH).padStart(2, "0");
      const minIso = String(startM).padStart(2, "0");
      document.getElementById("wIso").value = `${y}-${mmIso}-${ddIso}T${hhIso}:${minIso}:00+08:00`;
    }

    function normalizeArtFilename(raw) {
      let clean = (raw || '').trim().replace(/^\/+/, '');
      if (!clean) return 'wedding.jpg';
      if (!/\.(jpe?g|png|webp|gif)$/i.test(clean)) clean += '.jpg';
      return clean;
    }

    function normalizeHtmlFilename(raw) {
      let clean = (raw || '').trim().replace(/[^a-zA-Z0-9._-]/g, '');
      if (!clean) return 'temp.html';
      if (!/\.html?$/i.test(clean)) clean += '.html';
      return clean;
    }

    function esc(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function generateWedding() {
      const groom = document.getElementById('wGroom').value.trim() || 'Teruna';
      const bride = document.getElementById('wBride').value.trim() || 'Dara';
      const groomFam = document.getElementById('wGroomFam').value.trim();
      const brideFam = document.getElementById('wBrideFam').value.trim();
      const dayDateMs = document.getElementById('wDayDateMs').value.trim();
      const dayDateEn = document.getElementById('wDayDateEn').value.trim();
      const timeMs = document.getElementById('wTimeMs').value.trim();
      const timeEn = document.getElementById('wTimeEn').value.trim();
      const locMs = document.getElementById('wLocMs').value.trim();
      const locEn = document.getElementById('wLocEn').value.trim();
      const iso = document.getElementById('wIso').value.trim() || '2027-01-16T16:00:00+08:00';
      const mapUrl = document.getElementById('wMap').value.trim() || 'https://maps.google.com/';
      const artFile = normalizeArtFilename(document.getElementById('wArt').value);
      const outFile = normalizeHtmlFilename(document.getElementById('wFile').value);
      const theme = document.getElementById('wTheme').value;
      const useEnv = document.getElementById('wEnv').value === '1';

      document.getElementById('wArt').value = artFile;
      document.getElementById('wFile').value = outFile;

      const coupleShort = groom + ' & ' + bride;
      const hostsHtml = [groomFam, brideFam]
        .filter(Boolean)
        .map(line => '<span class="host-line">' + esc(line) + '</span>')
        .join('');

      const envBlock = useEnv ?
        '<div class="env-overlay" id="envOverlay" onclick="openInvitation()">' +
          '<div class="env-box">' +
            '<div class="env-label" id="envLabel">✦ Jemputan Walimatulurus ✦</div>' +
            '<div class="env-title">' + esc(coupleShort) + '</div>' +
            '<div class="env-sub" id="envSub">Tekan untuk membuka kad jemputan</div>' +
          '</div>' +
        '</div>' : '';

      let htmlLines = [];
      htmlLines.push('<!DOCTYPE html>');
      htmlLines.push('<html lang="ms">');
      htmlLines.push('<head>');
      htmlLines.push('  <meta charset="UTF-8" />');
      htmlLines.push('  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />');
      htmlLines.push('  <title>Walimatulurus — ' + esc(coupleShort) + '</title>');
      htmlLines.push('  <style>');
      htmlLines.push('    :root {');
      htmlLines.push('      --bg-grad: radial-gradient(circle at top, #2a1f16, #0d0906);');
      htmlLines.push('      --card-bg: #17120d;');
      htmlLines.push('      --text-main: #fdf6e7;');
      htmlLines.push('      --text-accent: #e5be6a;');
      htmlLines.push('      --border-col: #d4af37;');
      htmlLines.push('      --shadow-col: rgba(212, 175, 55, 0.28);');
      htmlLines.push('      --soft-box: rgba(229, 190, 106, 0.09);');
      htmlLines.push('    }');
      htmlLines.push('    [data-theme="emerald-gold"] { --bg-grad: radial-gradient(circle at top, #0d3b2e, #041a14); --card-bg: #07261d; --text-main: #ffffff; --text-accent: #facc15; --border-col: #facc15; --shadow-col: rgba(250, 204, 21, 0.28); --soft-box: rgba(250, 204, 21, 0.09); }');
      htmlLines.push('    [data-theme="ivory-gold"] { --bg-grad: radial-gradient(circle at top, #faf6ee, #e7dec8); --card-bg: #fffdf9; --text-main: #292524; --text-accent: #b45309; --border-col: #b45309; --shadow-col: rgba(180, 83, 9, 0.2); --soft-box: rgba(180, 83, 9, 0.08); }');
      htmlLines.push('    [data-theme="rose-gold"] { --bg-grad: radial-gradient(circle at top, #fce7f3, #f9a8d4); --card-bg: #fff1f2; --text-main: #4a1525; --text-accent: #b45309; --border-col: #d97706; --shadow-col: rgba(217, 119, 6, 0.24); --soft-box: rgba(217, 119, 6, 0.09); }');
      htmlLines.push('    [data-theme="royal-navy"] { --bg-grad: radial-gradient(circle at top, #172a45, #091324); --card-bg: #0d1b33; --text-main: #f8fafc; --text-accent: #f3d28a; --border-col: #e2c078; --shadow-col: rgba(243, 210, 138, 0.24); --soft-box: rgba(243, 210, 138, 0.09); }');
      htmlLines.push('    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }');
      htmlLines.push('    body {');
      htmlLines.push('      min-height: 100dvh; background: var(--bg-grad); color: var(--text-main);');
      htmlLines.push('      font-family: Georgia, \'Times New Roman\', serif; display: flex; align-items: center;');
      htmlLines.push('      justify-content: center; padding: 20px 14px;');
      htmlLines.push('    }');
      htmlLines.push('    .card {');
      htmlLines.push('      width: 100%; max-width: 430px; background: var(--card-bg); color: var(--text-main);');
      htmlLines.push('      border: 2px solid var(--border-col); border-radius: 22px; padding: 22px 18px 24px;');
      htmlLines.push('      text-align: center; box-shadow: 0 22px 50px rgba(0, 0, 0, 0.55), 0 0 28px var(--shadow-col);');
      htmlLines.push('    }');
      htmlLines.push('    .top-bar { display: flex; justify-content: flex-end; gap: 6px; margin-bottom: 6px; }');
      htmlLines.push('    .lang-btn {');
      htmlLines.push('      background: transparent; border: 1px solid rgba(229, 190, 106, 0.55); color: var(--text-main);');
      htmlLines.push('      padding: 4px 10px; border-radius: 999px; font-size: 11px;');
      htmlLines.push('      font-family: system-ui, -apple-system, sans-serif; cursor: pointer;');
      htmlLines.push('    }');
      htmlLines.push('    .lang-btn.active { background: var(--text-accent); color: #17120d; font-weight: 700; border-color: var(--text-accent); }');
      htmlLines.push('    .bismillah { font-size: 17px; color: var(--text-accent); margin-bottom: 4px; line-height: 1.7; }');
      htmlLines.push('    .badge { font-family: system-ui, -apple-system, sans-serif; font-size: 10.5px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-accent); margin-bottom: 12px; }');
      htmlLines.push('    .hosts { font-size: 12.5px; line-height: 1.65; opacity: 0.92; margin-bottom: 10px; }');
      htmlLines.push('    .hosts .host-line { display: block; }');
      htmlLines.push('    .couple { font-size: 26px; font-weight: bold; color: var(--text-accent); line-height: 1.25; margin: 6px 0 16px; }');
      htmlLines.push('    .couple span.amp { display: block; font-size: 17px; font-style: italic; margin: 2px 0; color: var(--text-main); }');
      htmlLines.push('    .art {');
      htmlLines.push('      width: 150px; height: 150px; margin: 0 auto 16px; border-radius: 50%;');
      htmlLines.push('      border: 3px solid var(--border-col); padding: 5px; box-shadow: 0 0 22px var(--shadow-col);');
      htmlLines.push('      overflow: hidden; display: flex; align-items: center; justify-content: center;');
      htmlLines.push('      background: var(--soft-box); animation: floatY 3.8s ease-in-out infinite;');
      htmlLines.push('    }');
      htmlLines.push('    .art img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block; }');
      htmlLines.push('    @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }');
      htmlLines.push('    .invite-intro { font-size: 13.5px; line-height: 1.55; margin-bottom: 14px; }');
      htmlLines.push('    .details-box {');
      htmlLines.push('      background: var(--soft-box); border: 1px solid rgba(212, 175, 55, 0.35);');
      htmlLines.push('      border-radius: 14px; padding: 12px; margin-bottom: 14px;');
      htmlLines.push('      font-family: system-ui, -apple-system, sans-serif; font-size: 12.5px; line-height: 1.65; text-align: left;');
      htmlLines.push('    }');
      htmlLines.push('    .countdown-box {');
      htmlLines.push('      background: var(--soft-box); border: 1px solid rgba(212, 175, 55, 0.35);');
      htmlLines.push('      border-radius: 14px; padding: 12px 10px; margin-bottom: 16px;');
      htmlLines.push('      font-family: system-ui, -apple-system, sans-serif;');
      htmlLines.push('    }');
      htmlLines.push('    .cd-heading { font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase; color: var(--text-accent); margin-bottom: 8px; }');
      htmlLines.push('    .cd-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }');
      htmlLines.push('    @media (max-width: 380px) { .cd-grid { grid-template-columns: repeat(3, 1fr); } }');
      htmlLines.push('    .cd-cell { background: rgba(0, 0, 0, 0.25); border: 1px solid rgba(229, 190, 106, 0.28); border-radius: 10px; padding: 6px 3px; }');

      htmlLines.push('    .cd-unit { font-size: 9.5px; opacity: 0.85; margin-top: 2px; }');

      htmlLines.push('    let currentLang = "ms";');
      htmlLines.push('    let audioCtx = null, masterGain = null, isPlaying = false, seqTimer = null, stepIdx = 0;');
      htmlLines.push('    function build3dKompangGraph(ctx) {');
      htmlLines.push('      const comp = ctx.createDynamicsCompressor();');
      htmlLines.push('      comp.threshold.value = -10; comp.knee.value = 12; comp.ratio.value = 4; comp.attack.value = 0.003; comp.release.value = 0.12;');
      htmlLines.push('      const boost = ctx.createGain(); boost.gain.value = 2.4;');
      htmlLines.push('      const splitter = ctx.createChannelSplitter(2);');
      htmlLines.push('      const merger = ctx.createChannelMerger(2);');
      htmlLines.push('      const dLeft = ctx.createDelay(1.0); const dRight = ctx.createDelay(1.0);');
      htmlLines.push('      dLeft.delayTime.value = 0.145; dRight.delayTime.value = 0.235;');
      htmlLines.push('      const fbLeft = ctx.createGain(); const fbRight = ctx.createGain();');
      htmlLines.push('      fbLeft.gain.value = 0.46; fbRight.gain.value = 0.48;');
      htmlLines.push('      const echoGain = ctx.createGain(); echoGain.gain.value = 0.72;');
      htmlLines.push('      const panner = ctx.createStereoPanner ? ctx.createStereoPanner() : null;');
      htmlLines.push('      const dryBus = ctx.createGain(); dryBus.gain.value = 1.35;');
      htmlLines.push('      const outGain = ctx.createGain(); outGain.gain.value = 1.45;');
      htmlLines.push('      dryBus.connect(comp);');
      htmlLines.push('      dryBus.connect(splitter);');
      htmlLines.push('      splitter.connect(dLeft, 0); splitter.connect(dRight, 1);');
      htmlLines.push('      dLeft.connect(fbLeft); fbLeft.connect(dRight); dRight.connect(fbRight); fbRight.connect(dLeft);');
      htmlLines.push('      dLeft.connect(merger, 0, 0); dRight.connect(merger, 0, 1);');
      htmlLines.push('      merger.connect(echoGain); echoGain.connect(comp);');
      htmlLines.push('      comp.connect(boost); boost.connect(outGain); outGain.connect(ctx.destination);');
      htmlLines.push('      return { dryBus, panner };');
      htmlLines.push('    }');
      htmlLines.push('    function hitKompang(ctx, dest, time, pitchBase, vel, panVal) {');
      htmlLines.push('      const osc = ctx.createOscillator();');
      htmlLines.push('      const gain = ctx.createGain();');
      htmlLines.push('      const filter = ctx.createBiquadFilter();');
      htmlLines.push('      osc.type = "triangle";');
      htmlLines.push('      osc.frequency.setValueAtTime(pitchBase * 1.65, time);');
      htmlLines.push('      osc.frequency.exponentialRampToValueAtTime(pitchBase, time + 0.045);');
      htmlLines.push('      osc.frequency.exponentialRampToValueAtTime(pitchBase * 0.72, time + 0.19);');
      htmlLines.push('      filter.type = "bandpass"; filter.frequency.setValueAtTime(pitchBase * 3.4, time); filter.Q.value = 1.8;');
      htmlLines.push('      gain.gain.setValueAtTime(0.001, time);');
      htmlLines.push('      gain.gain.linearRampToValueAtTime(vel, time + 0.008);');
      htmlLines.push('      gain.gain.exponentialRampToValueAtTime(0.001, time + 0.22);');
      htmlLines.push('      const nLen = Math.floor(ctx.sampleRate * 0.08);');
      htmlLines.push('      const nBuf = ctx.createBuffer(1, nLen, ctx.sampleRate);');
      htmlLines.push('      const ch = nBuf.getChannelData(0);');
      htmlLines.push('      for (let i = 0; i < nLen; i++) ch[i] = (Math.random() * 2 - 1) * Math.exp(-i / (nLen * 0.25));');
      htmlLines.push('      const noise = ctx.createBufferSource(); noise.buffer = nBuf;');
      htmlLines.push('      const nFilt = ctx.createBiquadFilter(); nFilt.type = "highpass"; nFilt.frequency.value = 1400;');
      htmlLines.push('      const nGain = ctx.createGain(); nGain.gain.setValueAtTime(vel * 0.55, time); nGain.gain.exponentialRampToValueAtTime(0.001, time + 0.06);');
      htmlLines.push('      let target = dest;');
      htmlLines.push('      if (dest.panner) { const p = ctx.createStereoPanner(); p.pan.setValueAtTime(panVal, time); p.connect(dest.dryBus); target = p; }');
      htmlLines.push('      else { target = dest.dryBus; }');
      htmlLines.push('      osc.connect(filter); filter.connect(gain); gain.connect(target);');
      htmlLines.push('      noise.connect(nFilt); nFilt.connect(nGain); nGain.connect(target);');
      htmlLines.push('      osc.start(time); osc.stop(time + 0.24);');
      htmlLines.push('      noise.start(time); noise.stop(time + 0.08);');
      htmlLines.push('    }');
      htmlLines.push('    function playFestiveLead(ctx, dest, time, freq, dur) {');
      htmlLines.push('      const osc = ctx.createOscillator();');
      htmlLines.push('      const g = ctx.createGain();');
      htmlLines.push('      osc.type = "sawtooth"; osc.frequency.setValueAtTime(freq, time);');

      htmlLines.push('      osc.connect(lp); lp.connect(g); g.connect(dest.dryBus);');
      htmlLines.push('      osc.start(time); osc.stop(time + dur + 0.02);');
      htmlLines.push('    }');
      htmlLines.push('    const kompPattern = [');

      htmlLines.push('      { p: 190, v: 0.78, pan: 0.7,  note: 783.99 },');

      htmlLines.push('    ];');
      htmlLines.push('    function startAudio() {');
      htmlLines.push('      const AC = window.AudioContext || window.webkitAudioContext;');
      htmlLines.push('      if (!audioCtx) { audioCtx = new AC(); masterGain = build3dKompangGraph(audioCtx); }');

      htmlLines.push('    const cdTarget = new Date("' + iso + '").getTime();');

      htmlLines.push('    }');
      htmlLines.push('    requestAnimationFrame(updateCountdown);');
      htmlLines.push('    setLang("ms");');
      htmlLines.push('    function showQr() {');
      htmlLines.push('      const modal = document.getElementById("qrModal");');
      htmlLines.push('      modal.style.display = "flex";');
      htmlLines.push('      const currentUrl = window.location.href;');
      htmlLines.push('      document.getElementById("qrUrlText").innerHTML = \'<a href="\' + currentUrl + \'" target="_blank">\' + currentUrl + \'</a>\';');
      htmlLines.push('      const canvas = document.getElementById("qrCanvas");');
      htmlLines.push('      const ctx = canvas.getContext("2d");');
      htmlLines.push('      const img = new Image();');
      htmlLines.push('      img.crossOrigin = "Anonymous";');
      htmlLines.push('      img.onload = function() { ctx.drawImage(img, 0, 0, canvas.width, canvas.height); };');
      htmlLines.push('      img.src = "https://api.qrserver.com/v1/create-qr-code/?size=400x400&data=" + encodeURIComponent(currentUrl);');
      htmlLines.push('    }');
      htmlLines.push('    function closeQr(e) {');
      htmlLines.push('      if(e && e.target.id !== "qrModal" && e.target.tagName !== "BUTTON") return;');
      htmlLines.push('      document.getElementById("qrModal").style.display = "none";');
      htmlLines.push('    }');
      htmlLines.push('    function saveQrCode() {');
      htmlLines.push('      const canvas = document.getElementById("qrCanvas");');
      htmlLines.push('      const link = document.createElement("a");');
      htmlLines.push('      link.download = "wedding-qr.png";');
      htmlLines.push('      link.href = canvas.toDataURL("image/png");');
      htmlLines.push('      link.click();');
      htmlLines.push('    }');
      htmlLines.push('  <\/script>');
      htmlLines.push('</body>');
      htmlLines.push('</html>');

      const finalHtml = htmlLines.join('\n');

      document.getElementById('outCode').value = finalHtml;
      document.getElementById('statusMsg').textContent = "HTML berjaya dijana (" + outFile + ")! Sedia untuk dimuat turun.";
    }

    function copyCode() {
      const code = document.getElementById('outCode');
      if (!code.value) { generateWedding(); }
      code.select();
      document.execCommand('copy');
      document.getElementById('statusMsg').textContent = "HTML berjaya disalin ke clipboard!";
    }

    function downloadHtml() {
      const code = document.getElementById('outCode').value;
      if (!code) { generateWedding(); }

      const filename = normalizeHtmlFilename(document.getElementById('wFile').value);
      const blob = new Blob([document.getElementById('outCode').value], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      document.getElementById('statusMsg').textContent = 'Fail ' + filename + ' berjaya dimuat turun!';
    }

    initDropdowns();
    generateWedding();
  </script>
</body>
</html>
